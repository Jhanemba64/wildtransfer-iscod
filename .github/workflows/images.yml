name: Build des images (tag au choix)

# Construit les 3 images de l'application depuis la branche choisie et les publie sur Docker Hub
# sous un tag dédié. Le tag "latest" (production OVH) est refusé.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag des images (ex. iscod)'
                required: true
                default: 'iscod'

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [frontend, backend, storage-api]
        steps:
            - name: Refuser le tag de production
              if: inputs.tag == 'latest'
              run: |
                  echo "Le tag latest est réservé à la production OVH."
                  exit 1

            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - uses: docker/build-push-action@v6
              with:
                  context: ./${{ matrix.service }}
                  file: ./${{ matrix.service }}/Dockerfile.prod
                  platforms: linux/amd64
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/wildtransfer-${{ matrix.service }}:${{ inputs.tag }}
