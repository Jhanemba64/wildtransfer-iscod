# Durcissement nginx WildTransfer (contexte http)
server_tokens off;
# Grafana charge une centaine de fichiers d'un coup : la supervision n'est pas limitée
# (clé vide = requête non comptée), sinon 429 puis bannissement fail2ban de l'admin
map $host $wt_req_key {
    ~^monitoring\.  "";
    default         $binary_remote_addr;
}
limit_req_zone $wt_req_key zone=wt_req:10m rate=10r/s;
limit_req_status 429;
add_header Strict-Transport-Security "max-age=31536000" always;
