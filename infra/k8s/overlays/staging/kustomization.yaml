# Préproduction : https://staging.wildtransfer.fr → nginx de l'hôte (TLS) → NodePort 30008 → passerelle.
# Mêmes manifestes et mêmes ressources que la production : seuls le namespace et le port changent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wildtransfer-staging

resources:
  - namespace.yaml
  - ../../base

patches:
  - target:
      kind: Service
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30008
