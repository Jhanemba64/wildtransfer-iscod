# Base PostgreSQL : un réplica, données sur un volume persistant (provisionneur local-path de k3s)
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: example # imposé par backend/src/db.ts ; seul le backend peut joindre la base (NetworkPolicy)
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -d, postgres, -U, postgres]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -d, postgres, -U, postgres]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
# Droits d'accès réseau : seul le backend peut ouvrir une connexion vers la base
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-backend-only
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
