# Sondes utilisées par Prometheus (job site et job api)
modules:
    http_2xx:
        prober: http
        timeout: 10s
        http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200]

    graphql:
        prober: http
        timeout: 10s
        http:
            preferred_ip_protocol: ip4
            method: POST
            headers:
                Content-Type: application/json
            body: '{"query":"{ __typename }"}'
            valid_status_codes: [200]
            fail_if_body_not_matches_regexp: ['Query']
