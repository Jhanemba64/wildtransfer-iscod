# Supervision WildTransfer : Prometheus (collecte), Grafana (tableaux de bord), Alertmanager (alertes e-mail),
# blackbox-exporter (sondes des services) et node-exporter (ressources du serveur).
# Tout écoute sur 127.0.0.1 : seul Grafana est publié, par le nginx de l'hôte, avec identifiant.
# Déployée par infra/scripts/deploy-monitoring.sh.

x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    prometheus:
        image: prom/prometheus:v3.4.2
        restart: unless-stopped
        network_mode: host
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=90d
            - --web.listen-address=127.0.0.1:9090
        volumes:
            - ./prometheus:/etc/prometheus:ro
            - prometheus-data:/prometheus
        mem_limit: 256m
        logging: *logging

    alertmanager:
        image: prom/alertmanager:v0.28.1
        restart: unless-stopped
        network_mode: host
        command:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --web.listen-address=127.0.0.1:9093
            - --cluster.listen-address=
        volumes:
            - ./alertmanager:/etc/alertmanager:ro
            - alertmanager-data:/alertmanager
        mem_limit: 64m
        logging: *logging

    blackbox:
        image: prom/blackbox-exporter:v0.27.0
        restart: unless-stopped
        network_mode: host
        command:
            - --config.file=/etc/blackbox/blackbox.yml
            - --web.listen-address=127.0.0.1:9115
        volumes:
            - ./blackbox:/etc/blackbox:ro
        mem_limit: 32m
        logging: *logging

    node-exporter:
        image: prom/node-exporter:v1.9.1
        restart: unless-stopped
        network_mode: host
        pid: host
        command:
            - --path.rootfs=/host
            - --web.listen-address=127.0.0.1:9100
        volumes:
            - /:/host:ro,rslave
        mem_limit: 64m
        logging: *logging

    grafana:
        image: grafana/grafana:11.6.0
        restart: unless-stopped
        network_mode: host
        env_file: ./grafana.env
        environment:
            GF_SERVER_HTTP_ADDR: 127.0.0.1
            GF_SERVER_HTTP_PORT: '3003'
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            GF_SECURITY_COOKIE_SECURE: 'true'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wildtransfer.json
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        mem_limit: 256m
        logging: *logging

volumes:
    prometheus-data:
    alertmanager-data:
    grafana-data:
