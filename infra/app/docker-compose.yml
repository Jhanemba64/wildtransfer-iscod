# Stack WildTransfer (production ou staging) : images publiées sur Docker Hub, déployée par infra/scripts/deploy.sh.
# Variables du fichier .env écrit par deploy.sh :
#   IMAGE_TAG : version des images (tag = commit, ex. sha-1a2b3c4) · APP_PORT : 7007 (prod) ou 7008 (staging)
# Aucun port exposé publiquement : tout passe par le nginx de l'hôte (127.0.0.1:APP_PORT).

# Rotation des logs : 3 fichiers de 10 Mo maximum par conteneur
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    db:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: example # imposé par backend/src/db.ts ; la base n'est joignable que sur le réseau interne
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -d postgres -U postgres']
            interval: 5s
            timeout: 10s
            retries: 20
        volumes:
            - db-data:/var/lib/postgresql
        mem_limit: 256m
        logging: *logging

    backend:
        image: pierrick64/wildtransfer-backend:${IMAGE_TAG:-latest}
        restart: unless-stopped
        env_file: ./backend.env
        healthcheck:
            test: 'curl --fail --request POST --header ''content-type: application/json'' --url ''http://localhost:4000'' --data ''{"query":"query { __typename }"}'' || exit 1'
            interval: 5s
            timeout: 10s
            retries: 30
        depends_on:
            db:
                condition: service_healthy
        mem_limit: 384m
        logging: *logging

    frontend:
        image: pierrick64/wildtransfer-frontend:${IMAGE_TAG:-latest}
        restart: unless-stopped
        healthcheck:
            test: "curl --fail --request GET --url 'http://localhost' || exit 1"
            interval: 5s
            timeout: 10s
            retries: 20
        depends_on:
            backend:
                condition: service_healthy
        mem_limit: 64m
        logging: *logging

    storage-api:
        image: pierrick64/wildtransfer-storage-api:${IMAGE_TAG:-latest}
        restart: unless-stopped
        env_file: ./storage-api.env
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        volumes:
            - uploads:/app/uploads
        mem_limit: 256m
        logging: *logging

    api_gateway:
        image: nginx
        restart: unless-stopped
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            backend:
                condition: service_healthy
            frontend:
                condition: service_healthy
        ports:
            - 127.0.0.1:${APP_PORT:-7007}:80
        mem_limit: 64m
        logging: *logging

# Données persistantes : survivent aux mises à jour et redémarrages
volumes:
    db-data:
    uploads:
